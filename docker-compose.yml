services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: apm, POSTGRES_USER: apm, POSTGRES_PASSWORD: apm }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U apm"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: external
      DB_URL: jdbc:postgresql://postgres:5432/apm
      DB_USER: apm
      DB_PASSWORD: apm
      REDIS_HOST: redis
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
  generator:
    build: ./backend
    profiles: [demo]
    entrypoint: ["java", "-cp", "/app/app.jar", "-Dloader.main=dev.apm.sim.GeneratorMain", "org.springframework.boot.loader.launch.PropertiesLauncher"]
    command: ["--url", "http://backend:8080", "--minutes", "30", "--rps", "20"]
    depends_on: [backend]
volumes: { pgdata: {} }
